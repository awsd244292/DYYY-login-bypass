name: build deb

on:
  push:
    branches:
      - main
    paths:
      - '*.h'
      - '*.m'
      - '*.mm'
      - '*.x'
      - '*.xm'
      - '*.c'
      - '*.cc'
      - '*.cpp'
      - '*.s'
      - '*.S'
      - 'DYYY.plist'
      - 'control'
      - 'Makefile'
      - 'Resources/**'
      - 'layout/**'
  workflow_dispatch:
    inputs:
      scheme:
        description: '打包方案（默认 rootful；自签/巨魔用户只用产出的 DYYY.dylib 注入到抖音 IPA）'
        required: false
        default: 'rootful'
        type: choice
        options:
          - rootful
          - all
          - rootless
          - roothide

permissions:
  actions: read
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.relevance.outputs.should_build }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect build-relevant changes
        id: relevance
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] ||
             .github/scripts/build-relevance.sh range "$PUSH_BEFORE" "$GITHUB_SHA"; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Build-relevant plugin, package, or Makefile changes detected."
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Only non-build Makefile settings changed; skipping Deb build."
          fi

  build:
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Check cache
        run: |
          echo upstream_heads=`git ls-remote https://github.com/roothide/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV

      - name: Use cache
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Remove unused Homebrew taps
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
          HOMEBREW_NO_AUTOREMOVE: "1"
        run: |
          if brew list --formula | grep -Fxq "bicep"; then
            brew uninstall --formula --ignore-dependencies bicep
          fi
          for tap in aws/tap azure/bicep; do
            if brew tap | grep -Fxq "$tap"; then
              brew untap "$tap"
            fi
          done

      - name: Prepare Theos
        uses: huami1314/theos-action@main

      - name: Setup GNU Make
        run: |
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Clean packages dir
        run: rm -rf packages && mkdir -p packages
        
      - name: Build Rootful
        run: |
          make package FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          for f in packages/*.deb; do
            [ -f "$f" ] && [[ "$f" != *"-root"*".deb" ]] && mv "$f" "${f%.deb}-rootful.deb"
          done
             
      - name: Build Rootless
        if: ${{ github.event.inputs.scheme == 'all' || github.event.inputs.scheme == 'rootless' }}
        run: |
          #make package FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          for f in packages/*.deb; do
            [ -f "$f" ] && [[ "$f" != *"-root"*".deb" ]] && mv "$f" "${f%.deb}-rootless.deb"
          done
          
      - name: Build Roothide
        if: ${{ github.event.inputs.scheme == 'all' || github.event.inputs.scheme == 'roothide' }}
        run: |
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          for f in packages/*.deb; do
            [ -f "$f" ] && [[ "$f" != *"-root"*".deb" ]] && mv "$f" "${f%.deb}-roothide.deb"
          done
          
      - name: Prepare package metadata
        id: package
        run: |
          timestamp=$(TZ=Asia/Shanghai date +%Y%m%d%H%M%S)
          version=$(awk -F': ' '$1 == "Version" { print $2; exit }' control)
          if [ -z "$version" ]; then
            echo "Unable to read package version from control" >&2
            exit 1
          fi
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify Deb packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # rootful 是必产出项：自签/巨魔用户注入用的 DYYY.dylib 由它提供。
          # rootful 版二进制内不含任何 LC_RPATH / /var/jb / .jbroot 越狱搜索路径，
          # 注入到未越狱 App 沙盒时最干净，因此作为默认产出的提取源。
          expected_schemes=(rootful)
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            case "${{ github.event.inputs.scheme }}" in
              all) expected_schemes=(rootful rootless roothide) ;;
              rootful|roothide) expected_schemes=(${{ github.event.inputs.scheme }}) ;;
            esac
          fi

          for scheme in "${expected_schemes[@]}"; do
            scheme_files=(packages/*-"${scheme}".deb)
            if [ "${#scheme_files[@]}" -ne 1 ]; then
              echo "Expected exactly one ${scheme} package, found ${#scheme_files[@]}" >&2
              exit 1
            fi
          done

          deb_files=(packages/*.deb)
          printf 'Package artifact: %s\n' "${deb_files[@]}"

      - name: Extract injectable dylib
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          # 自签/巨魔用户直接拿这个 dylib 注入到抖音 IPA。
          # rootful 包的 dylib 不含 LC_RPATH 越狱搜索路径、不含 /var/jb、.jbroot 前缀，
          # 注入场景最干净；且含 arm64 + arm64e 双切片。
          SOURCE_DEB_GLOB: 'packages/*rootful*.deb'
          REQUIRED_ARCH: 'arm64e'
        run: .github/scripts/extract-release-dylib.sh

      - name: Upload injectable dylib
        uses: actions/upload-artifact@v7
        with:
          name: DYYY-${{ steps.package.outputs.version }}
          path: ${{ github.workspace }}/packages/*.dylib
